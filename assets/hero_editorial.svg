<svg width="640" height="280" viewBox="0 0 640 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="280" rx="16" fill="#F8FAFC"/>
  <!-- Editorial Grid Background -->
  <line x1="40" y1="40" x2="600" y2="40" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="40" y1="240" x2="600" y2="240" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="40" y1="40" x2="40" y2="240" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="600" y1="40" x2="600" y2="240" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="280" y1="40" x2="280" y2="240" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Newspaper / Document Representation -->
  <g transform="translate(60, 65)">
    <rect width="180" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="10" rx="2" fill="#0E7490"/>
    <rect x="16" y="34" width="148" height="6" rx="2" fill="#334155"/>
    <rect x="16" y="46" width="120" height="6" rx="2" fill="#334155"/>
    <rect x="16" y="64" width="68" height="40" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
    <line x1="92" y1="68" x2="164" y2="68" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="92" y1="78" x2="164" y2="78" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="92" y1="88" x2="150" y2="88" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="92" y1="98" x2="160" y2="98" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="116" x2="164" y2="116" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="126" x2="130" y2="126" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Inspection Lens & Waveform -->
  <g transform="translate(260, 110)">
    <!-- Connecting flow -->
    <path d="M 0 30 Q 30 10 60 30 T 120 30" fill="none" stroke="#0E7490" stroke-width="2.5" stroke-dasharray="4 2"/>
    <circle cx="60" cy="30" r="4" fill="#0E7490"/>
  </g>

  <!-- Explainable AI Attribution Card Representation -->
  <g transform="translate(400, 65)">
    <rect width="180" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="16" y="16" width="85" height="10" rx="2" fill="#0F172A"/>
    <rect x="16" y="32" width="50" height="5" rx="1.5" fill="#64748B"/>
    <!-- Feature attribution bars -->
    <g transform="translate(16, 50)">
      <rect x="0" y="4" width="70" height="8" rx="2" fill="rgba(21, 128, 61, 0.2)"/>
      <rect x="0" y="4" width="52" height="8" rx="2" fill="#15803D"/>
      <text x="78" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#15803D" font-weight="600">+0.42</text>

      <rect x="0" y="20" width="70" height="8" rx="2" fill="rgba(21, 128, 61, 0.2)"/>
      <rect x="0" y="20" width="38" height="8" rx="2" fill="#15803D"/>
      <text x="78" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#15803D" font-weight="600">+0.31</text>

      <rect x="0" y="36" width="70" height="8" rx="2" fill="rgba(220, 38, 38, 0.2)"/>
      <rect x="0" y="36" width="44" height="8" rx="2" fill="#DC2626"/>
      <text x="78" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#DC2626" font-weight="600">-0.35</text>

      <rect x="0" y="52" width="70" height="8" rx="2" fill="rgba(220, 38, 38, 0.2)"/>
      <rect x="0" y="52" width="28" height="8" rx="2" fill="#DC2626"/>
      <text x="78" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#DC2626" font-weight="600">-0.22</text>
    </g>
    <!-- Confidence badge -->
    <rect x="16" y="122" width="148" height="16" rx="4" fill="#F1F5F9"/>
    <circle cx="28" cy="130" r="4" fill="#15803D"/>
    <text x="38" y="133" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#334155" font-weight="600">Model Confidence: 91.4%</text>
  </g>
</svg>
