<svg width="640" height="280" viewBox="0 0 640 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="280" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Editorial Grid Lines -->
  <line x1="30" y1="35" x2="610" y2="35" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="30" y1="245" x2="610" y2="245" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="300" y1="35" x2="300" y2="245" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Left: News Story Document Representation -->
  <g transform="translate(45, 55)">
    <rect width="210" height="165" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Newspaper Masthead Bar -->
    <rect x="18" y="18" width="80" height="10" rx="3" fill="#0E7490"/>
    <rect x="18" y="36" width="174" height="6" rx="2" fill="#0F172A"/>
    <rect x="18" y="48" width="140" height="6" rx="2" fill="#334155"/>
    <!-- Photo / Media Area Placeholder -->
    <rect x="18" y="66" width="75" height="48" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
    <circle cx="55" cy="90" r="14" fill="#CBD5E1" fill-opacity="0.5"/>
    <!-- Text Lines -->
    <line x1="105" y1="72" x2="190" y2="72" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="84" x2="185" y2="84" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="96" x2="170" y2="96" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="108" x2="180" y2="108" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="126" x2="192" y2="126" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="138" x2="150" y2="138" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Center: Optical Inspection & Verification Nexus -->
  <g transform="translate(265, 115)">
    <!-- Dynamic Flow Beams -->
    <path d="M 0 25 Q 35 5 70 25" fill="none" stroke="#0E7490" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="35" cy="18" r="5" fill="#0E7490"/>
    <circle cx="35" cy="18" r="8" stroke="#0E7490" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Right: Verification & Explainable AI Audit Panel -->
  <g transform="translate(365, 55)">
    <rect width="225" height="165" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="18" y="18" width="95" height="10" rx="3" fill="#0F172A"/>
    <rect x="18" y="34" width="60" height="5" rx="2" fill="#64748B"/>

    <!-- Abstract Feature Contribution Indicators (No hardcoded numbers or fake scores) -->
    <g transform="translate(18, 52)">
      <!-- Supportive / Evidence Alignment Bar -->
      <rect x="0" y="4" width="110" height="8" rx="2" fill="rgba(21, 128, 61, 0.15)"/>
      <rect x="0" y="4" width="75" height="8" rx="2" fill="#15803D"/>
      <line x1="120" y1="8" x2="175" y2="8" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>

      <rect x="0" y="20" width="110" height="8" rx="2" fill="rgba(21, 128, 61, 0.15)"/>
      <rect x="0" y="20" width="50" height="8" rx="2" fill="#15803D"/>
      <line x1="120" y1="24" x2="160" y2="24" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>

      <!-- Contradicting / Deception Marker Bar -->
      <rect x="0" y="36" width="110" height="8" rx="2" fill="rgba(220, 38, 38, 0.15)"/>
      <rect x="0" y="36" width="60" height="8" rx="2" fill="#DC2626"/>
      <line x1="120" y1="40" x2="168" y2="40" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>

      <rect x="0" y="52" width="110" height="8" rx="2" fill="rgba(220, 38, 38, 0.15)"/>
      <rect x="0" y="52" width="38" height="8" rx="2" fill="#DC2626"/>
      <line x1="120" y1="56" x2="150" y2="56" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Audit & Verification Badge (Defensible, informative description without fake percentages) -->
    <g transform="translate(18, 130)">
      <rect width="188" height="20" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="12" cy="10" r="4" fill="#0E7490"/>
      <rect x="24" y="6" width="70" height="4" rx="1.5" fill="#334155"/>
      <rect x="24" y="12" width="110" height="3" rx="1" fill="#64748B"/>
    </g>
  </g>
</svg>
